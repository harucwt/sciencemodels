<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#101820">
    <title>Estructuras</title>
    <link rel="stylesheet" href="./menu.bundle.css">
    <style>
        :root {
            color-scheme: dark;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f4f7f8;
            background: #101820;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding:
                max(28px, env(safe-area-inset-top, 0px))
                max(28px, env(safe-area-inset-right, 0px))
                max(28px, env(safe-area-inset-bottom, 0px))
                max(28px, env(safe-area-inset-left, 0px));
        }

        #background {
            position: fixed;
            z-index: -1;
            inset: 0;
            background: #101820;
        }

        #root {
            position: relative;
            min-height: calc(100vh - 56px);
            min-height: calc(100dvh - 56px);
        }

        .pattern-waves {
            position: fixed;
            z-index: 0;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .pattern-waves canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .menu {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: calc(100vh - 56px);
            min-height: calc(100dvh - 56px);
            flex-direction: column;
            justify-content: center;
            width: min(100%, 1120px);
            margin: 0 auto;
        }

        .menu-title {
            position: relative;
            z-index: 2;
            width: 100%;
            margin: 0 auto 20px;
            overflow: hidden;
            border-radius: 18px;
            background: linear-gradient(90deg, rgb(16 24 32 / 96%), rgb(16 24 32 / 84%));
        }

        .models-heading {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin: 0 0 16px;
        }

        .models-heading h2 {
            margin: 0;
            font-size: 1rem;
            font-weight: 650;
        }

        .models-heading span {
            color: #aab9c0;
            font-size: 0.88rem;
        }

        .models-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .model-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-width: 0;
            min-height: 88px;
            padding: 20px;
            border: 1px solid rgb(226 242 243 / 22%);
            border-radius: 16px;
            background: rgb(16 29 37 / 78%);
            color: inherit;
            text-decoration: none;
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
        }

        .model-card:hover,
        .model-card:focus-visible {
            transform: translateY(-3px);
            border-color: #9bd8d0;
            background: rgb(24 44 52 / 90%);
        }

        .model-card:focus-visible {
            outline: 3px solid #9bd8d0;
            outline-offset: 4px;
        }

        .model-info {
            min-width: 0;
        }

        .model-info h3 {
            margin: 0;
            font-size: 1.08rem;
            line-height: 1.35;
        }

        .model-arrow {
            flex: 0 0 auto;
            color: #9bd8d0;
            font-size: 1.6rem;
        }

        @media (max-width: 680px) {
            body {
                padding:
                    max(24px, env(safe-area-inset-top, 0px))
                    max(20px, env(safe-area-inset-right, 0px))
                    max(24px, env(safe-area-inset-bottom, 0px))
                    max(20px, env(safe-area-inset-left, 0px));
            }

            .menu {
                min-height: calc(100vh - 48px);
                min-height: calc(100dvh - 48px);
            }

            .models-grid {
                grid-template-columns: 1fr;
            }

            .model-card {
                min-height: 76px;
                padding: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div id="background" aria-hidden="true"></div>
    <div id="root"></div>
    <script src="./menu.bundle.js" defer></script>
</body>
</html>
