<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#101820">
    <title>Modelos de ciencias en 3D</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f4f7f8;
            background: #101820;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding:
                max(28px, env(safe-area-inset-top, 0px))
                max(28px, env(safe-area-inset-right, 0px))
                max(28px, env(safe-area-inset-bottom, 0px))
                max(28px, env(safe-area-inset-left, 0px));
        }

        #background {
            position: fixed;
            z-index: -1;
            inset: 0;
            background: #101820;
        }

        #root {
            position: relative;
            min-height: calc(100vh - 56px);
            min-height: calc(100dvh - 56px);
        }

        .pattern-waves {
            position: fixed;
            z-index: 0;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .pattern-waves canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .menu {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: calc(100vh - 56px);
            min-height: calc(100dvh - 56px);
            flex-direction: column;
            justify-content: center;
            width: min(100%, 1120px);
            margin: 0 auto;
        }

        .eyebrow {
            margin: 0 0 14px;
            color: #9bd8d0;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 760px;
            margin: 0;
            font-size: clamp(2.5rem, 7vw, 5.5rem);
            letter-spacing: -0.055em;
            line-height: 0.98;
        }

        .intro {
            max-width: 580px;
            margin: 20px 0 40px;
            color: #c0cbd0;
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.6;
        }

        .models-heading {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin: 0 0 16px;
        }

        .models-heading h2 {
            margin: 0;
            font-size: 1rem;
            font-weight: 650;
        }

        .models-heading span {
            color: #aab9c0;
            font-size: 0.88rem;
        }

        .model-card {
            display: flex;
            align-items: center;
            gap: 20px;
            width: min(100%, 520px);
            min-height: 132px;
            padding: 22px;
            border: 1px solid rgb(226 242 243 / 22%);
            border-radius: 18px;
            background: rgb(16 29 37 / 78%);
            color: inherit;
            text-decoration: none;
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
        }

        .model-card:hover,
        .model-card:focus-visible {
            transform: translateY(-3px);
            border-color: #9bd8d0;
            background: rgb(24 44 52 / 90%);
        }

        .model-card:focus-visible {
            outline: 3px solid #9bd8d0;
            outline-offset: 4px;
        }

        .model-icon {
            display: grid;
            width: 76px;
            height: 76px;
            flex: 0 0 auto;
            place-items: center;
            border: 1px solid rgb(155 216 208 / 35%);
            border-radius: 15px;
            background: linear-gradient(145deg, rgb(81 160 152 / 30%), rgb(24 48 60 / 75%));
            color: #b6eee3;
        }

        .model-icon svg {
            width: 42px;
            height: 42px;
        }

        .model-info {
            flex: 1;
        }

        .model-info h3 {
            margin: 0 0 7px;
            font-size: 1.2rem;
        }

        .model-info p {
            margin: 0;
            color: #c0cbd0;
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .model-arrow {
            flex: 0 0 auto;
            color: #9bd8d0;
            font-size: 1.6rem;
        }

        @media (max-width: 520px) {
            body {
                padding:
                    max(24px, env(safe-area-inset-top, 0px))
                    max(20px, env(safe-area-inset-right, 0px))
                    max(24px, env(safe-area-inset-bottom, 0px))
                    max(20px, env(safe-area-inset-left, 0px));
            }

            .menu {
                min-height: calc(100vh - 48px);
                min-height: calc(100dvh - 48px);
            }

            .intro {
                margin-bottom: 32px;
            }

            .model-card {
                gap: 14px;
                min-height: 112px;
                padding: 16px;
            }

            .model-icon {
                width: 60px;
                height: 60px;
            }

            .model-icon svg {
                width: 34px;
                height: 34px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div id="background" aria-hidden="true"></div>
    <div id="root"></div>
    <script src="./menu.bundle.js" defer></script>
</body>
</html>
