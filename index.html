<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#101820">
    <title>Estructuras</title>
    <style>
.particle-text{position:relative;display:block;width:100%;height:100%;min-height:240px;overflow:hidden;touch-action:none;isolation:isolate}.particle-text__canvas{position:absolute;inset:0;display:block;width:100%;height:100%}.particle-text__sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

</style>
    <style>
        :root {
            color-scheme: dark;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f4f7f8;
            background: #101820;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding:
                max(28px, env(safe-area-inset-top, 0px))
                max(28px, env(safe-area-inset-right, 0px))
                max(28px, env(safe-area-inset-bottom, 0px))
                max(28px, env(safe-area-inset-left, 0px));
        }

        #background {
            position: fixed;
            z-index: -1;
            inset: 0;
            background: #101820;
        }

        #root {
            position: relative;
            min-height: calc(100vh - 56px);
            min-height: calc(100dvh - 56px);
        }

        .pattern-waves {
            position: fixed;
            z-index: 0;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .pattern-waves canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .menu {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: calc(100vh - 56px);
            min-height: calc(100dvh - 56px);
            flex-direction: column;
            justify-content: flex-start;
            width: min(100%, 1120px);
            margin: 0 auto;
        }

        .menu-title {
            position: relative;
            z-index: 2;
            width: 100%;
            margin: 0 auto 20px;
            overflow: hidden;
            border-radius: 18px;
        }

        .models-heading {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin: 0 0 16px;
        }

        .models-heading h2 {
            margin: 0;
            font-size: 1rem;
            font-weight: 650;
        }

        .models-heading span {
            color: #aab9c0;
            font-size: 0.88rem;
        }

        .models-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .model-card {
            position: relative;
            isolation: isolate;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-width: 0;
            min-height: 88px;
            padding: 20px;
            overflow: hidden;
            border: 1px solid rgb(226 242 243 / 18%);
            border-radius: 16px;
            background: rgb(16 29 37 / 20%);
            color: inherit;
            text-decoration: none;
            -webkit-backdrop-filter: blur(8px) saturate(1.5);
            backdrop-filter: blur(8px) saturate(1.5);
            box-shadow:
                inset 0 1px 0 rgb(255 255 255 / 5%),
                0 8px 24px rgb(0 0 0 / 12%);
            transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
        }

        .model-card::before,
        .model-card::after {
            position: absolute;
            z-index: 0;
            pointer-events: none;
            content: "";
            opacity: 0;
            transition: opacity 180ms ease;
        }

        .model-card::before {
            inset: 0;
            background: radial-gradient(
                ellipse at var(--shine-x, 50%) var(--shine-y, 50%),
                rgb(255 255 255 / 16%),
                transparent 58%
            );
        }

        .model-card::after {
            inset: 0;
            padding: 1px;
            border-radius: inherit;
            background: conic-gradient(
                from var(--shine-angle, 135deg),
                transparent 0deg 125deg,
                rgb(255 255 255 / 90%) 150deg,
                rgb(155 216 208 / 85%) 165deg,
                transparent 195deg 360deg
            );
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
        }

        .model-card:hover,
        .model-card:focus-visible {
            transform: translateY(-3px);
            border-color: rgb(226 242 243 / 38%);
            background: rgb(16 29 37 / 28%);
            box-shadow:
                inset 0 1px 0 rgb(255 255 255 / 8%),
                0 12px 28px rgb(0 0 0 / 18%);
        }

        .model-card:hover::before,
        .model-card:hover::after,
        .model-card:focus-visible::before,
        .model-card:focus-visible::after {
            opacity: 1;
        }

        .model-card:focus-visible {
            outline: 3px solid #9bd8d0;
            outline-offset: 4px;
        }

        .model-info {
            position: relative;
            z-index: 1;
            min-width: 0;
        }

        .model-info h3 {
            margin: 0;
            font-size: 1.08rem;
            line-height: 1.35;
        }

        .model-arrow {
            position: relative;
            z-index: 1;
            flex: 0 0 auto;
            color: #9bd8d0;
            font-size: 1.6rem;
        }

        @media (max-width: 680px) {
            body {
                padding:
                    max(24px, env(safe-area-inset-top, 0px))
                    max(20px, env(safe-area-inset-right, 0px))
                    max(24px, env(safe-area-inset-bottom, 0px))
                    max(20px, env(safe-area-inset-left, 0px));
            }

            .menu {
                min-height: calc(100vh - 48px);
                min-height: calc(100dvh - 48px);
            }

            .models-grid {
                grid-template-columns: 1fr;
            }

            .model-card {
                min-height: 76px;
                padding: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
